spring:
  application:
    name: tp-api-cuentas

  datasource:
    url: "jdbc:mysql://localhost:3306/tp_fintech?createDatabaseIfNotExist=true"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  jackson:
    serialization:
      indent-output: true
